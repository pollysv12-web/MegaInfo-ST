name: Проверки и выпуск

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Зависимости
        # Сервер пакетов иногда не отвечает вовремя — до трёх попыток с паузой.
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 && exit 0
            echo "Попытка $attempt не удалась, жду и пробую снова"
            sleep 30
          done
          exit 1
      - name: Юнит-тесты
        run: npm test
      - name: Chromium для браузерных проверок
        run: npx playwright install --with-deps chromium
      - name: Браузерные проверки
        run: npm run test:browser

  # Новая версия из manifest.json получает тег и страницу выпуска с текстом из CHANGELOG.md.
  # Создаются выпуски только новее последнего существующего тега.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Теги и выпуски
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          for ver in $(grep -oP '^## \K\d+\.\d+\.\d+(?= )' CHANGELOG.md | sort -V); do
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$ver" "$latest" | sort -V | tail -1)" = "$latest" ]; then continue; fi
            sha=$(git log --reverse --format=%H -S"\"version\": \"$ver\"" -- manifest.json | head -1)
            if [ -z "$sha" ]; then echo "Версия $ver не найдена в manifest.json — пропускаю"; continue; fi
            # Тег отправляется обычным git push — это разрешено токену проверок.
            git tag -a "v$ver" "$sha" -m "MegaInfo $ver"
            git push origin "v$ver"
            echo "Тег v$ver поставлен на $sha"
            # Страница выпуска — дополнение: если GitHub её не разрешит, тег всё равно остаётся.
            awk -v v="$ver" 'index($0, "## " v " ") == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md
            if gh release create "v$ver" --verify-tag --title "MegaInfo $ver" --notes-file notes.md; then
              echo "Страница выпуска v$ver создана"
            else
              echo "::warning::Тег v$ver создан, но страницу выпуска GitHub создать не разрешил"
            fi
          done

  # Служебные ветки, уже целиком вошедшие в main, удаляются.
  cleanup:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Удалить слитые ветки
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin); do
            case "$ref" in claude/*|test-UI) ;; *) continue ;; esac
            if git merge-base --is-ancestor "origin/$ref" origin/main; then
              git push origin --delete "$ref"
              echo "Удалена слитая ветка $ref"
            fi
          done
