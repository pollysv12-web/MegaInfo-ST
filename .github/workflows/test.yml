name: Проверки и выпуск

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Зависимости
        # Сервер пакетов иногда не отвечает вовремя — до трёх попыток с паузой.
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 && exit 0
            echo "Попытка $attempt не удалась, жду и пробую снова"
            sleep 30
          done
          exit 1
      - name: Юнит-тесты
        run: npm test
      - name: Chromium для браузерных проверок
        run: npx playwright install --with-deps chromium
      - name: Браузерные проверки
        run: npm run test:browser

  # Новая версия из manifest.json получает тег и страницу выпуска с текстом из CHANGELOG.md.
  # Создаются выпуски только новее последнего существующего тега.
  # Встроенный ключ GitHub не может ставить теги на коммиты, меняющие файлы в .github/workflows,
  # и не может создавать страницы выпусков. Для этого в секретах репозитория хранится RELEASE_TOKEN
  # (ключ с правами Contents и Workflows). Без него шаг только предупреждает и не падает.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Проверка ключа RELEASE_TOKEN
        id: key
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          warn() { echo "::warning::$1"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # Пробелы и переносы строк, случайно попавшие в секрет при вставке, не считаются частью ключа.
          RELEASE_TOKEN=$(printf '%s' "$RELEASE_TOKEN" | tr -d '[:space:]')
          case "$RELEASE_TOKEN" in ''|github_pat_*|ghp_*) ;; *) warn "RELEASE_TOKEN не похож на ключ GitHub: он должен начинаться с github_pat_ (или ghp_). Вставьте в секрет сам ключ, а не его название." ;; esac
          [ -n "$RELEASE_TOKEN" ] || warn "Секрета RELEASE_TOKEN нет — теги не ставятся (см. docs/DEVELOPMENT.md)."
          code=$(curl -s -o repo.json -w '%{http_code}' -H "Authorization: Bearer $RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY")
          case "$code" in
            200) ;;
            401) warn "GitHub не принял RELEASE_TOKEN: ключ неверный, просрочен или вставлен с лишним пробелом. Создайте ключ заново и замените секрет." ;;
            403|404) warn "RELEASE_TOKEN не видит репозиторий: в настройках ключа Repository access → Only select repositories → MegaInfo-ST." ;;
            *) warn "Неожиданный ответ GitHub при проверке RELEASE_TOKEN: HTTP $code." ;;
          esac
          [ "$(jq -r '.permissions.push // false' repo.json)" = "true" ] \
            || warn "У RELEASE_TOKEN нет права записи: в Repository permissions поставьте Contents → Read and write."
          echo "Ключ RELEASE_TOKEN принят"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Теги и выпуски
        if: steps.key.outputs.ok == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TOKEN=$(printf '%s' "$RELEASE_TOKEN" | tr -d '[:space:]')
          export GH_TOKEN="$RELEASE_TOKEN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          # Дальше git работает с ключом RELEASE_TOKEN, а не со встроенным ключом проверок.
          git config --local --unset-all http.https://github.com/.extraheader || true
          remote="https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          for ver in $(grep -oP '^## \K\d+\.\d+\.\d+(?= )' CHANGELOG.md | sort -V); do
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$ver" "$latest" | sort -V | tail -1)" = "$latest" ]; then continue; fi
            sha=$(git log --reverse --format=%H -S"\"version\": \"$ver\"" -- manifest.json | head -1)
            if [ -z "$sha" ]; then echo "Версия $ver не найдена в manifest.json — пропускаю"; continue; fi
            git tag -a "v$ver" "$sha" -m "MegaInfo $ver"
            if ! git push "$remote" "v$ver"; then
              git tag -d "v$ver" >/dev/null
              echo "::warning::Тег v$ver не поставлен. Проверьте ключ RELEASE_TOKEN: Repository access — MegaInfo-ST, права Contents и Workflows — Read and write."
              continue
            fi
            echo "Тег v$ver поставлен на $sha"
            awk -v v="$ver" 'index($0, "## " v " ") == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md
            if gh release create "v$ver" --verify-tag --title "MegaInfo $ver" --notes-file notes.md; then
              echo "Страница выпуска v$ver создана"
            else
              echo "::warning::Тег v$ver поставлен, но страницу выпуска создать не удалось."
            fi
          done

  # Служебные ветки, уже целиком вошедшие в main, удаляются.
  cleanup:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Удалить слитые ветки
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin); do
            case "$ref" in claude/*|test-UI) ;; *) continue ;; esac
            if git merge-base --is-ancestor "origin/$ref" origin/main; then
              git push origin --delete "$ref"
              echo "Удалена слитая ветка $ref"
            fi
          done
